name: بناء APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk salati.apk

      - uses: actions/upload-artifact@v4
        with:
          name: salati-apk
          path: salati.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: صلاتي — آخر إصدار
          body: ملف التثبيت salati.apk لآخر نسخة من الفرع الرئيسي.
          files: salati.apk
          make_latest: true
