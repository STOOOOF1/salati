name: بناء APK

on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Tajawal font
        run: |
          mkdir -p app/src/main/res/font
          for w in Regular Medium Bold ExtraBold; do
            f=app/src/main/res/font/tajawal_$(echo $w | tr 'A-Z' 'a-z').ttf
            [ -s "$f" ] || curl -fsSL -o "$f" "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-$w.ttf"
          done
          ls -l app/src/main/res/font

      - name: Save font in repo
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain app/src/main/res/font)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/res/font
            git commit -m "إضافة ملفات خط Tajawal [skip ci]"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key from secret (optional)
        env:
          KEYSTORE_B64: ${{ secrets.SALATI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/salati.jks"
            echo "SALATI_KEYSTORE=$RUNNER_TEMP/salati.jks" >> "$GITHUB_ENV"
            echo "SIGNING: fixed key"
          else
            echo "SIGNING: debug key (no secret)"
          fi

      - name: Build APK
        env:
          SALATI_KEY_PASS: ${{ secrets.SALATI_KEY_PASS }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk salati.apk
          code=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          name=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          notes=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          printf '{"versionCode": %s, "versionName": "%s", "notes": "%s"}\n' "$code" "$name" "$notes" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: salati-apk
          path: |
            salati.apk
            version.json

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: صلاتي — آخر إصدار
          body: ملف التثبيت salati.apk لآخر نسخة من الفرع الرئيسي.
          files: |
            salati.apk
            version.json
          make_latest: true
