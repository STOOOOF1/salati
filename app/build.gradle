plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zarraqai.salati'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zarraqai.salati'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.7'
    }

    // مفتاح توقيع ثابت من أسرار GitHub (SALATI_KEYSTORE_B64 و SALATI_KEY_PASS) حتى تعمل التحديثات
    // فوق النسخة المثبتة. إن لم يتوفر يُستعمل مفتاح التصحيح المؤقت.
    def ksPath = System.getenv('SALATI_KEYSTORE')
    def hasKey = ksPath != null && new File(ksPath).exists()

    signingConfigs {
        if (hasKey) {
            salati {
                storeFile file(ksPath)
                storePassword System.getenv('SALATI_KEY_PASS')
                keyAlias 'salati'
                keyPassword System.getenv('SALATI_KEY_PASS')
            }
        }
    }

    buildTypes {
        debug {
            if (hasKey) signingConfig signingConfigs.salati
        }
        release {
            minifyEnabled false
            if (hasKey) signingConfig signingConfigs.salati
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
