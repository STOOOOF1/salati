plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zarraqai.salati'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zarraqai.salati'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '2.0.2'
    }

    // مفتاح توقيع ثابت محفوظ في المستودع (app/salati.jks) حتى تعمل التحديثات فوق النسخة المثبتة.
    // يمكن استبداله بمفتاح من أسرار GitHub (SALATI_KEYSTORE و SALATI_KEY_PASS).
    def envKs = System.getenv('SALATI_KEYSTORE')
    def useEnv = envKs != null && new File(envKs).exists()
    def hasKey = true

    signingConfigs {
        salati {
            storeFile useEnv ? file(envKs) : file('salati.jks')
            storePassword useEnv ? System.getenv('SALATI_KEY_PASS') : 'salati-app-key'
            keyAlias 'salati'
            keyPassword useEnv ? System.getenv('SALATI_KEY_PASS') : 'salati-app-key'
        }
    }

    buildTypes {
        debug {
            if (hasKey) signingConfig signingConfigs.salati
        }
        release {
            minifyEnabled false
            if (hasKey) signingConfig signingConfigs.salati
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // ماسح الباركود/QR من خدمات Google (لإيقاف المنبّه الذكي بمسح رمز)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
